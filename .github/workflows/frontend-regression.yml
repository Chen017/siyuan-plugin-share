name: Reader frontend regression

on:
  push:
    branches: ['beta/**']
    paths:
      - 'php-site/**'
      - 'index.js'
      - 'index.css'
      - 'plugin.json'
      - 'i18n/**'
      - 'tests/frontend.cjs'
      - 'tests/reader-ui.cjs'
      - 'tests/controls.cjs'
      - 'tests/footnotes.cjs'
      - 'tests/plugin.cjs'
      - 'tests/pdf-text-layer.*'
      - '.github/workflows/frontend-regression.yml'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated DOM test runtime
        run: npm install --prefix "$RUNNER_TEMP/reader-test" --no-save jsdom@26.1.0 jspdf@4.0.0
      - name: Check plugin and reader syntax and JSON manifests
        run: |
          for file in index.js php-site/assets/*.js; do node --check "$file"; done
          node -e "for (const path of ['plugin.json', 'i18n/en_US.json', 'i18n/zh_CN.json']) JSON.parse(require('node:fs').readFileSync(path, 'utf8'))"
      - name: Verify plugin lifecycle, Markdown and reader interaction
        run: |
          NODE_PATH="$RUNNER_TEMP/reader-test/node_modules" node tests/plugin.cjs
          NODE_PATH="$RUNNER_TEMP/reader-test/node_modules" node tests/frontend.cjs
          NODE_PATH="$RUNNER_TEMP/reader-test/node_modules" node tests/reader-ui.cjs
          NODE_PATH="$RUNNER_TEMP/reader-test/node_modules" node tests/controls.cjs
          NODE_PATH="$RUNNER_TEMP/reader-test/node_modules" node tests/footnotes.cjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify selectable PDFs with Chromium PDFium
        run: |
          python -m pip install --only-binary=:all: pypdfium2==5.14.0
          NODE_PATH="$RUNNER_TEMP/reader-test/node_modules" node tests/pdf-text-layer.cjs "$RUNNER_TEMP/pdf-selection"
          python tests/pdf-text-layer.py "$RUNNER_TEMP/pdf-selection"
