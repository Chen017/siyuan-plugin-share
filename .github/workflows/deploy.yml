name: Deploy Siyuan Plugin Share

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_pdf_limits:
        description: 'Explicitly apply 60 minutes / 120 documents per visitor; ordinary deployment preserves saved settings'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vps-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build and update VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 25m
          script: |
            set -eu
            exec 9>/root/.siyuan-share-deploy.lock
            flock -n 9
            cd /root/siyuan-plugin-share
            test "$(git branch --show-current)" = main
            git diff --quiet
            git diff --cached --quiet
            git fetch origin main
            git merge --ff-only origin/main
            docker compose build --pull web
            docker run --rm --network none --entrypoint php siyuan-share-web:latest -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3 || PHP_VERSION_ID < 80336) exit(1); echo "Built PHP ", PHP_VERSION, "\n";'
            docker compose up -d --no-build --pull never web
            health=
            for attempt in $(seq 1 60); do
              health=$(docker inspect --format '{{.State.Health.Status}}' siyuan-share-web)
              test "$health" = healthy && break
              sleep 2
            done
            test "$health" = healthy
            test "$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/login)" = 200
            docker exec siyuan-share-web php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3 || PHP_VERSION_ID < 80336) exit(1); echo "Running PHP ", PHP_VERSION, "\n";'
            if [ '${{ github.event_name == 'workflow_dispatch' && inputs.apply_pdf_limits && 'yes' || 'no' }}' = yes ]; then
              docker exec --user www-data -i siyuan-share-web php /dev/stdin /var/www/html 60 120 < scripts/configure-pdf-limits.php
            fi
            docker image prune -f
            echo 'VPS updated; container healthy and login HTTP 200.'
