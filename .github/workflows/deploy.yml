name: Deploy Siyuan Plugin Share

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect VPS or back up and install the tested main revision
        type: choice
        options: [inspect, deploy]
        default: inspect
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: vps-deployment
  cancel-in-progress: false

jobs:
  inspect:
    if: inputs.operation == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect VPS deployment without changing data
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -eu
            cd /root/siyuan-plugin-share
            printf 'Repository status\n'
            git status --short
            git branch --show-current
            git rev-parse HEAD
            printf 'Storage capacity\n'
            df -h . /root
            printf 'Container and mounts\n'
            docker inspect siyuan-share-web --format 'image={{.Image}} status={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{end}}'
            docker inspect siyuan-share-web --format '{{range .Mounts}}{{println .Type .Source .Destination .RW}}{{end}}'
            docker inspect siyuan-share-web --format '{{json .NetworkSettings.Ports}}'
            printf 'Compose services\n'
            docker compose config --services
            docker compose config --images
            printf 'Runtime and data sizes\n'
            docker exec siyuan-share-web php -v
            docker exec siyuan-share-web sh -c 'du -sh /var/www/html/storage /var/www/html/uploads; test -f /var/www/html/config.php && echo config-present || true'
            printf 'HTTP smoke test\n'
            curl -sS -o /dev/null -w 'login=%{http_code}\n' http://127.0.0.1:8081/login

  deploy:
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require a successful full regression for this exact main commit
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              throw new Error('VPS installation is restricted to main');
            }
            const branch = await github.rest.repos.getBranch({...context.repo, branch: 'main'});
            if (branch.data.commit.sha !== context.sha) {
              throw new Error('Main changed; test and deploy the current revision');
            }
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'php83-regression.yml',
              branch: 'main', head_sha: context.sha, per_page: 30
            });
            const latest = runs.data.workflow_runs[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error('The latest regression for this commit has not passed');
            }
            core.info(`Verified regression: ${latest.html_url}`);
      - name: Back up data, verify restoration, build and install
        shell: bash
        env:
          VPS_HOST: ${{ secrets.HOST }}
          VPS_PORT: ${{ secrets.PORT }}
          VPS_USER: ${{ secrets.USERNAME }}
          VPS_SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          set -euo pipefail
          task_dir=$(mktemp -d)
          trap 'rm -rf "$task_dir"' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > "$task_dir/key"
          chmod 600 "$task_dir/key"
          options=(-i "$task_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o "UserKnownHostsFile=$task_dir/known_hosts")
          bundle="siyuan-maintenance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          tar -czf "$task_dir/$bundle" scripts/backup-data.sh scripts/deploy-vps.sh scripts/data-snapshot.php
          scp "${options[@]}" -P "$VPS_PORT" "$task_dir/$bundle" "$VPS_USER@$VPS_HOST:/tmp/$bundle"
          ssh "${options[@]}" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "set -eu; task_dir=\$(mktemp -d /tmp/siyuan-maintenance.XXXXXX); chmod 700 \"\$task_dir\"; tar -xzf /tmp/$bundle -C \"\$task_dir\"; bash \"\$task_dir/scripts/deploy-vps.sh\" '$GITHUB_SHA'; rm -f /tmp/$bundle; rm -rf \"\$task_dir\""
