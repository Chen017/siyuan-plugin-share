name: Deploy Siyuan Plugin Share

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply_pdf_limits:
        description: 'Explicitly apply 60 minutes / 120 documents per visitor; ordinary deployment preserves saved settings'
        required: false
        default: false
        type: boolean
      apply_pdf_batch_limit:
        description: 'Explicitly set the saved PDF batch limit to 120 documents'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vps-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build and update VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          command_timeout: 25m
          script: |
            set -eu
            umask 077
            exec 9>/root/.siyuan-share-deploy.lock
            flock -n 9
            cd /root/siyuan-plugin-share
            test "$(git branch --show-current)" = main
            git diff --quiet
            git diff --cached --quiet
            git fetch origin main
            git merge --ff-only origin/main
            docker compose build --pull web
            docker run --rm --network none --entrypoint php siyuan-share-web:latest -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3 || PHP_VERSION_ID < 80336) exit(1); echo "Built PHP ", PHP_VERSION, "\n";'
            migration_backup=
            # This schema retirement gets one verified backup; routine upgrades keep the existing policy.
            if ! docker exec siyuan-share-web php -r '$c = is_file("/var/www/html/config.php") ? require "/var/www/html/config.php" : []; $p = new PDO("sqlite:" . ($c["db_path"] ?? "/var/www/html/storage/app.db")); $p->exec("PRAGMA query_only=ON"); $s=$p->prepare("SELECT value FROM settings WHERE key=?"); $s->execute(["admin_only_schema_v1"]); exit($s->fetchColumn() === "1" ? 0 : 1);'; then
              backup_log=$(mktemp)
              bash scripts/backup-data.sh siyuan-share-web /root/siyuan-share-backups | tee "$backup_log"
              migration_backup=$(sed -n 's/^BACKUP_DIR=//p' "$backup_log")
              rm -f "$backup_log"
              test -n "$migration_backup" && test -f "$migration_backup/VERIFIED"
              docker stop --signal SIGTERM --time 30 siyuan-share-web >/dev/null
              docker run --rm --network none --read-only --volumes-from siyuan-share-web:ro -v "$PWD/scripts:/ops:ro" --entrypoint php siyuan-share-web:latest /ops/data-snapshot.php /var/www/html/storage/app.db --core-only > "$migration_backup/core-before.json"
            fi
            docker compose up -d --no-build --pull never web
            health=
            for attempt in $(seq 1 60); do
              health=$(docker inspect --format '{{.State.Health.Status}}' siyuan-share-web)
              test "$health" = healthy && break
              sleep 2
            done
            test "$health" = healthy
            test "$(curl --max-time 15 -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/login)" = 200
            docker exec siyuan-share-web php -r 'if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 3 || PHP_VERSION_ID < 80336) exit(1); echo "Running PHP ", PHP_VERSION, "\n";'
            if [ -n "$migration_backup" ]; then
              docker cp scripts/data-snapshot.php siyuan-share-web:/tmp/core-data-snapshot.php
              docker exec siyuan-share-web php /tmp/core-data-snapshot.php /var/www/html/storage/app.db --core-only > "$migration_backup/core-after.json"
              cmp "$migration_backup/core-before.json" "$migration_backup/core-after.json"
              docker exec siyuan-share-web php -r '$p=new PDO("sqlite:/var/www/html/storage/app.db"); $p->exec("PRAGMA query_only=ON"); $s=$p->prepare("SELECT value FROM settings WHERE key=?"); $s->execute(["admin_only_schema_v1"]); if ($s->fetchColumn() !== "1" || $p->query("PRAGMA foreign_key_check")->fetch()) exit(1);'
              printf 'CORE_DATA_PRESERVED=1\nMIGRATION_BACKUP=%s\n' "$migration_backup"
            fi
            if [ '${{ github.event_name == 'workflow_dispatch' && inputs.apply_pdf_limits && 'yes' || 'no' }}' = yes ]; then
              docker exec --user www-data -i siyuan-share-web php /dev/stdin /var/www/html 60 120 < scripts/configure-pdf-limits.php
            fi
            if [ '${{ github.event_name == 'workflow_dispatch' && inputs.apply_pdf_batch_limit && 'yes' || 'no' }}' = yes ]; then
              docker exec --user www-data -i siyuan-share-web php /dev/stdin /var/www/html --batch 120 < scripts/configure-pdf-limits.php
            fi
            docker image prune -f
            echo 'VPS updated; container healthy and login HTTP 200.'
