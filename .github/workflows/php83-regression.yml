name: PHP 8.3 regression

on:
  push:
    branches: [main, 'beta/**']
    paths:
      - 'php-site/**'
      - 'tests/**'
      - 'scripts/**'
      - '.dockerignore'
      - 'docker-compose*.yml'
      - '.github/workflows/php83-regression.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build current PHP 8.3 image
        run: docker build --pull --no-cache -f php-site/Dockerfile -t siyuan-share:php83-test .
      - name: Test PHP runtime, database, HTTP APIs and Nginx rules
        run: python3 tests/run.py --docker siyuan-share:php83-test
      - name: Verify consistent backup and restoration using disposable data
        run: |
          bash -n scripts/backup-data.sh scripts/deploy-vps.sh tests/backup-fixture.sh
          python tests/deploy-guard.py
          php_file=scripts/data-snapshot.php
          docker run --rm --entrypoint php -v "$PWD/scripts:/ops:ro" siyuan-share:php83-test -l "/ops/$(basename "$php_file")"
          bash tests/backup-fixture.sh siyuan-share:php83-test
