name: PHP 8.3 regression

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install browser test runtime
        run: npm install --prefix "$RUNNER_TEMP/browser-test" --no-save --ignore-scripts playwright@1.56.1
      - name: Build current PHP 8.3 image
        run: |
          # Reproduce private VPS checkout permissions; the image must still serve public assets.
          find php-site -type d -exec chmod 700 {} +
          find php-site -type f -exec chmod 600 {} +
          docker build --pull --no-cache -f php-site/Dockerfile -t siyuan-share:php83-test .
      - name: Verify plugin and server archives without publishing
        run: |
          python tests/package.py
          python tests/release-tag.py
          python tests/plugin-release-plan.py
          python tests/docs.py
          python tests/image-compression.py --docker siyuan-share:php83-test
      - name: Test PHP runtime, database, HTTP APIs and Nginx rules
        run: |
          python3 tests/github-auth.py --php "$(command -v php)"
          chrome=$(command -v google-chrome)
          NODE_PATH="$RUNNER_TEMP/browser-test/node_modules" SPS_TEST_BROWSER="$chrome" node tests/image-sizing.cjs
          SIYUAN_BROWSER_EXECUTABLE="$chrome" SIYUAN_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-test/node_modules/playwright" node tests/pdf-math.cjs
          SIYUAN_BROWSER_EXECUTABLE="$chrome" SIYUAN_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-test/node_modules/playwright" node tests/pdf-delimiter.cjs
          SIYUAN_BROWSER_EXECUTABLE="$chrome" SIYUAN_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-test/node_modules/playwright" node tests/heading-spacing.cjs
          SIYUAN_BROWSER_EXECUTABLE="$chrome" SIYUAN_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-test/node_modules/playwright" node tests/tree-groups.cjs
          SIYUAN_CHROMIUM_EXECUTABLE="$chrome" \
          SIYUAN_BROWSER_EXECUTABLE="$chrome" \
          SIYUAN_PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser-test/node_modules/playwright" \
          python3 tests/run.py --docker siyuan-share:php83-test --browser
      - name: Verify consistent backup and restoration using disposable data
        run: |
          bash -n scripts/*.sh backup-volumes.sh tests/backup-fixture.sh
          python tests/deploy-guard.py
          php_file=scripts/data-snapshot.php
          docker run --rm --entrypoint php -v "$PWD/scripts:/ops:ro" siyuan-share:php83-test -l "/ops/$(basename "$php_file")"
          bash tests/backup-fixture.sh siyuan-share:php83-test
