name: GitHub Release

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      prerelease:
        default: false
        type: boolean
      latest:
        default: false
        type: boolean
      already_tested:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: Release version (used for tag and Release title)
        required: true
        type: string
      prerelease:
        description: Set as a pre-release
        required: false
        default: false
        type: boolean
      latest:
        description: Set as the latest release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  php-regression:
    if: inputs.already_tested != true
    uses: ./.github/workflows/php83-regression.yml
  reader-regression:
    if: inputs.already_tested != true
    uses: ./.github/workflows/frontend-regression.yml
  publish-release:
    needs: [php-regression, reader-regression]
    if: ${{ !cancelled() && (inputs.already_tested == true || (needs.php-regression.result == 'success' && needs.reader-regression.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate inputs
        id: validate
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail

          VERSION="$(printf '%s' "${INPUT_VERSION}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ -z "${VERSION}" ]; then
            echo "Input version cannot be empty."
            exit 1
          fi

          if [ "${INPUT_PRERELEASE}" = "true" ] && [ "${INPUT_LATEST}" = "true" ]; then
            echo "Set as a pre-release and Set as the latest release cannot both be enabled."
            exit 1
          fi

          if ! git check-ref-format "refs/tags/${VERSION}" >/dev/null; then
            echo "Invalid tag format: ${VERSION}"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "Version must be a plain filename component."
            exit 1
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Check release and tag status
        id: state
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION;
            const { owner, repo } = context.repo;

            try {
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag: version,
              });
              core.setFailed(`Release ${version} already exists.`);
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            let tagExists = true;
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `tags/${version}`,
              });
            } catch (error) {
              if (error.status === 404) {
                tagExists = false;
              } else {
                throw error;
              }
            }

            core.info(`tag_exists=${tagExists}`);
            core.setOutput('tag_exists', String(tagExists));

      - name: Verify existing tag points to tested commit
        if: steps.state.outputs.tag_exists == 'true'
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: python3 scripts/check-release-tag.py "$VERSION" "$GITHUB_SHA"

      - name: Build release archives
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          AUTO_RELEASE: ${{ inputs.already_tested }}
        run: |
          set -euo pipefail
          if [ "$AUTO_RELEASE" = true ]; then
            python3 scripts/package.py --output . --version "$VERSION" --plugin-version "$VERSION"
          else
            python3 scripts/package.py --output . --version "$VERSION"
          fi

      - name: Create tag if missing
        if: steps.state.outputs.tag_exists != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${VERSION}" "${GITHUB_SHA}"
          git push origin "refs/tags/${VERSION}"

      - name: Create release and upload assets
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.validate.outputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_LATEST: ${{ inputs.latest }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = require('path');

            const version = process.env.VERSION;
            const prerelease = String(process.env.INPUT_PRERELEASE).toLowerCase() === 'true';
            const latest = String(process.env.INPUT_LATEST).toLowerCase() === 'true';
            const { owner, repo } = context.repo;

            const releasePayload = {
              owner,
              repo,
              tag_name: version,
              name: version,
              body: '',
              draft: true,
              prerelease,
            };

            const makeLatest = latest ? 'true' : (!prerelease ? 'legacy' : undefined);

            const release = await github.rest.repos.createRelease(releasePayload);

            const files = [
              path.join(process.env.GITHUB_WORKSPACE, 'package.zip'),
              path.join(process.env.GITHUB_WORKSPACE, `php-site-${version}.zip`),
            ];

            for (const filePath of files) {
              const fileName = path.basename(filePath);
              const data = fs.readFileSync(filePath);

              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.data.id,
                name: fileName,
                data,
                headers: {
                  'content-type': 'application/zip',
                  'content-length': data.length,
                },
              });

              core.info(`Uploaded ${fileName}`);
            }

            await github.rest.repos.updateRelease({
              owner, repo, release_id: release.data.id, draft: false,
              ...(makeLatest ? { make_latest: makeLatest } : {}),
            });
            core.info(`Published ${release.data.html_url}`);
